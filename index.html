<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#6735e8">
<title>BAKSANA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--p:#6735e8;--p2:#8055f5;--dark:#11121a;--muted:#777986;--bg:#f7f7fa;--bd:#e9e9ef}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f2f2f5;color:var(--dark);overflow-x:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}

#onboarding{
    position:fixed;
    inset:0;
    z-index:99;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden
}

.ob{
    width:100%;
    max-width:500px;
    min-height:100vh;
    padding:42px 24px 24px;
    display:flex;
    flex-direction:column;
    position:relative;
    text-align:center;
    overflow:hidden
}

.brand-logo{
    width:96px;
    height:96px;
    object-fit:contain;
    margin:0 auto 8px;
    position:relative;
    z-index:3
}

.brand{
    font-size:40px;
    font-weight:850;
    letter-spacing:-2.5px;
    position:relative;
    z-index:3
}

.tag{
    margin-top:10px;
    font-size:11px;
    letter-spacing:3.5px;
    color:#555765;
    position:relative;
    z-index:3
}

.intro{
    margin:28px auto 0;
    font-size:20px;
    line-height:1.45;
    max-width:350px;
    position:relative;
    z-index:3
}

.ob-art{
    position:absolute;
    left:-8%;
    right:-8%;
    bottom:155px;
    height:390px;
    opacity:.42;
    pointer-events:none;
    z-index:1;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    overflow:hidden
}

.ob-art{
    position:absolute;
    left:0;
    right:0;
    bottom:145px;
    height:430px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    opacity:.48;
    pointer-events:none;
    z-index:1;
}

.ob-art img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center center;
    display:block;
    filter:grayscale(1) contrast(.9);
    mix-blend-mode:multiply;
}

.next{
    position:absolute;
    left:24px;
    right:24px;
    bottom:108px;
    height:60px;
    border:0;
    border-radius:30px;
    background:linear-gradient(135deg,var(--p2),var(--p));
    color:#fff;
    font-size:18px;
    font-weight:750;
    box-shadow:0 12px 28px rgba(103,53,232,.24);
    z-index:5
}

.next span{
    font-size:26px;
    margin-left:9px;
    vertical-align:-1px
}

.feats{
    position:absolute;
    left:18px;
    right:18px;
    bottom:18px;
    height:72px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    z-index:5;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(12px);
    border:1px solid #ececf2;
    border-radius:20px;
    box-shadow:0 8px 24px rgba(17,18,26,.06);
    overflow:hidden
}

.feat{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:11px;
    line-height:1.25;
    color:#4f5060;
    padding:0 5px
}

.feat:not(:last-child){
    border-right:1px solid #e5e5eb
}

.feat b{
    font-size:20px;
    color:var(--p);
    margin-bottom:5px;
    line-height:1
}

#app{display:none;min-height:100vh;background:var(--bg);padding-bottom:78px}
.head{background:#fff;border-bottom:1px solid #eeeef2;padding:18px 18px 14px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandrow{display:flex;align-items:center;gap:10px}
.mini{width:42px;height:42px;object-fit:contain}
.head small{display:block;color:#7a7b87;font-size:11px;margin-bottom:2px}
.head strong{font-size:17px}
.bell{width:42px;height:42px;border-radius:50%;border:0;background:#f5f3ff;color:var(--p);font-size:20px}

.content{padding:22px 18px}
.hello{margin-bottom:18px}
.hello h1,.page h1{font-size:28px;letter-spacing:-.8px;margin-bottom:5px}
.hello p,.page p{color:var(--muted);font-size:14px;line-height:1.5}
.search{height:50px;background:#fff;border:1px solid var(--bd);border-radius:16px;display:flex;align-items:center;padding:0 16px;color:#92939d;margin-bottom:20px}
.search span{margin-left:9px;font-size:14px}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-head h2{font-size:20px}
.link{border:0;background:transparent;color:var(--p);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:17px;cursor:pointer;min-height:155px;transition:.15s}
.card:active{transform:scale(.98)}
.icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;margin-bottom:12px}
.clean{background:#eee9ff}.tech{background:#fff2d8}.car{background:#e5f1ff}.sofa{background:#e5f7ef}
.card h3{font-size:16px;margin-bottom:5px}
.card p{font-size:12px;color:var(--muted);line-height:1.4}

.promo{margin-top:16px;min-height:135px;border-radius:22px;padding:22px;color:#fff;background:linear-gradient(110deg,#4720ba,#7441ed);position:relative;overflow:hidden}
.promo:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-70px;top:-70px;background:#ffffff14}
.promo h3{font-size:20px;max-width:230px;margin-bottom:6px}
.promo p{color:#fff;opacity:.85;max-width:240px}

.page{padding:8px 2px 18px}
.page h1{margin-bottom:6px}
.orders{display:flex;flex-direction:column;gap:12px}

.track{margin-bottom:14px;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:16px}
.track h3{font-size:16px;margin-bottom:5px}
.track p{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.track-grid{display:grid;gap:9px}
.track input{height:46px;border:1px solid #dddde5;border-radius:12px;padding:0 12px;outline:0}
.track input:focus{border-color:var(--p);box-shadow:0 0 0 4px #6735e812}
.track-btn{width:100%;height:46px;margin-top:9px;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:700}

.ord{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:17px}
.ordtop{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
.code{font-size:11px;color:var(--p);font-weight:800;margin-bottom:5px}
.ord h3{font-size:17px}
.status{padding:7px 10px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;height:max-content}
.waiting{background:#fff3d7;color:#a66b00}
.accepted{background:#e8f1ff;color:#2867c7}
.progress{background:#eee9ff;color:#6735e8}
.done{background:#e4f7ed;color:#208653}
.rejected{background:#ffe8e8;color:#c73737}
.oinfo{display:flex;gap:18px;color:#60616d;font-size:13px;margin-bottom:10px}
.loc{padding-top:10px;border-top:1px solid #f0f0f3;color:#777986;font-size:13px;line-height:1.7}
.opt{display:inline-block;margin-top:10px;background:#f5f2ff;color:var(--p);padding:7px 10px;border-radius:9px;font-size:12px;font-weight:650}
.biz{margin-top:9px;font-size:12px;color:#696a76}

.empty{background:#fff;border:1px solid var(--bd);border-radius:22px;padding:35px 22px;text-align:center}
.empty .ei{width:70px;height:70px;border-radius:22px;background:#eee9ff;display:grid;place-items:center;font-size:32px;margin:0 auto 17px}
.empty h2{font-size:19px;margin-bottom:8px}
.empty p{margin-bottom:18px}
.smallbtn{border:0;background:#eee9ff;color:var(--p);padding:11px 16px;border-radius:12px;font-weight:700}

.profile{background:#fff;border:1px solid var(--bd);border-radius:22px;padding:20px;display:flex;gap:15px;align-items:center}
.avatar{width:58px;height:58px;border-radius:19px;background:#eee9ff;display:grid;place-items:center;font-size:27px}
.profile h2{font-size:18px;margin-bottom:4px}
.profile p{color:var(--muted);font-size:13px}
.account{margin-top:14px;background:#fff;border:1px solid var(--bd);border-radius:22px;overflow:hidden}
.aitem{min-height:72px;padding:13px 15px;display:flex;align-items:center;gap:13px;border-bottom:1px solid #f0f0f3}
.aitem:last-child{border-bottom:0}
.ai{width:42px;height:42px;border-radius:13px;background:#f3f0ff;display:grid;place-items:center}
.aitem main{flex:1}
.aitem strong{display:block;font-size:14px;margin-bottom:3px}
.aitem span{color:#80818c;font-size:12px}
.aitem button{border:0;background:transparent;color:var(--p);font-size:22px}
.help{margin-top:14px;padding:18px;background:#f0ecff;border-radius:20px}
.help strong{display:block;margin-bottom:6px}
.help p{font-size:13px;color:#656675;line-height:1.5}

.nav{position:fixed;left:0;right:0;bottom:0;height:70px;background:#ffffffef;backdrop-filter:blur(16px);border-top:1px solid #e9e9ef;display:flex;z-index:50}
.nav button{flex:1;border:0;background:transparent;color:#858691;font-size:11px;font-weight:650}
.nav button.active{color:var(--p)}
.nav span{display:block;font-size:22px;margin-bottom:4px}

.modal{position:fixed;inset:0;background:#0f0f167a;display:none;align-items:flex-end;z-index:100}
.modal.show{display:flex}
.sheet{width:100%;max-height:92vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:22px 20px 30px}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.sheethead h2{font-size:22px}
.close{width:38px;height:38px;border:0;border-radius:50%;background:#f3f3f7;font-size:20px}
.group{margin-bottom:16px}
.group label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}
.group input,.group select,.group textarea{width:100%;height:48px;border:1px solid #dedee6;border-radius:13px;padding:0 13px;outline:0;background:#fff}
.group textarea{height:90px;padding:13px;resize:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.optpick{border:1.5px solid #e2e2e9;border-radius:14px;padding:14px}
.optpick.selected{border-color:var(--p);background:#f5f2ff}
.optpick strong{display:block;margin-bottom:4px}
.optpick small{color:#777}
.primary{width:100%;height:55px;border:0;border-radius:28px;background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;font-size:16px;font-weight:700}
.primary:disabled{opacity:.65}

.toast{position:fixed;left:18px;right:18px;bottom:88px;background:#171820;color:#fff;padding:15px 18px;border-radius:14px;font-size:14px;z-index:200;display:none}
.toast.show{display:block}

@media(max-width:360px){
  .brand{font-size:34px}
  .brand-logo{width:88px;height:88px}
  .intro{font-size:17px}
  .ob{padding-top:30px}
}
</style>
</head>

<body>

<section id="onboarding">
  <div class="ob">
    <img class="brand-logo" src="baksana-logo-cropped.png" alt="BAKSANA">
    <div class="brand">BAKSANA</div>
    <div class="tag">SİTE HAYATINI KOLAYLAŞTIRIR.</div>

    <div class="intro">
      Sitenizde ihtiyacınız olan<br>
      hizmetlere birkaç dokunuşla<br>
      ulaşın.
    </div>

    <div class="ob-art">
      <img src="baksana-site-sketch.png" alt="">
    </div>

    <button class="next" onclick="startApp()">
      İLERİ <span>→</span>
    </button>

    <div class="feats">
      <div class="feat"><b>✓</b>Güvenilir<br>hizmet</div>
      <div class="feat"><b>⚡</b>Kolay<br>sipariş</div>
      <div class="feat"><b>♙</b>Site sakinlerine<br>özel</div>
    </div>
  </div>
</section>


<section id="app">

<header class="head">
  <div class="headrow">
    <div class="brandrow">
      <img class="mini" src="baksana-logo-cropped.png" alt="BAKSANA">
      <div>
        <small>BAKSANA</small>
        <strong id="siteName">NOVA RESIDENCE</strong>
      </div>
    </div>

    <button class="bell">🔔</button>
  </div>
</header>


<main class="content" id="main"></main>


<nav class="nav">

  <button
    data-page="home"
    class="active"
    onclick="showHome()"
  >
    <span>⌂</span>
    Ana Sayfa
  </button>

  <button
    data-page="orders"
    onclick="showOrders()"

  </button>

  <button
    data-page="account"
    onclick="showAccount()"
  >
    <span>♙</span>
    Hesabım
  </button>

</nav>

</section>


<div
  class="modal"
  id="serviceModal"
>

  <div class="sheet">

    <div class="sheethead">

      <h2 id="serviceTitle">
        Hizmet
      </h2>

      <button
        class="close"
        onclick="closeService()"
      >
        ×
      </button>

    </div>


    <div class="group">

      <label>
        Hizmet seçeneği
      </label>

      <div
        class="opts"
        id="options"
      ></div>

    </div>


    <div class="group">

      <label>
        Tarih
      </label>

      <input
        id="serviceDate"
        type="date"
      >

    </div>


    <div class="group">

      <label>
        Saat
      </label>

      <select id="serviceTime">

        <option value="">
          Saat seçin
        </option>

        <option>09:00</option>
        <option>11:00</option>
        <option>13:00</option>
        <option>15:00</option>
        <option>17:00</option>
        <option>19:00</option>

      </select>

    </div>


    <div class="group">

      <label>
        Blok
      </label>

      <input
        id="block"
        placeholder="Örn. B Blok"
      >

    </div>


    <div class="group">

      <label>
        Daire
      </label>

      <input
        id="apartment"
        placeholder="Örn. 24"
      >

    </div>


    <div class="group">

      <label>
        Telefon
      </label>

      <input
        id="phone"
        type="tel"
        placeholder="05XX XXX XX XX"
      >

    </div>


    <div class="group">

      <label>
        Not
      </label>

      <textarea
        id="note"
        placeholder="Eklemek istediğiniz bir şey var mı?"
      ></textarea>

    </div>


    <button
      id="createBtn"
      class="primary"
      onclick="createOrder()"
    >
      Talep Oluştur →
    </button>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

const SUPABASE_URL =
  "https://ahvplyeunubpbtsdzldj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qF3PlPnw-g4dXeOiL-OSOw_LzKQ9kuO";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* SITE */

const SITE_SLUG =
  (
    new URLSearchParams(
      location.search
    )
    .get("site")
    ||
    "nova"
  )
  .trim()
  .toLowerCase();


let site = {
  id:null,
  slug:SITE_SLUG,
  name:"NOVA RESIDENCE"
};


/* DURUM */

let page = "home";
let service = "";
let option = "";
let refreshTimer = null;


/* HİZMETLER */

const serviceOptions = {

  "Ev Temizliği":[
    ["1+1 Ev","Standart temizlik"],
    ["2+1 Ev","Standart temizlik"],
    ["3+1 Ev","Standart temizlik"],
    ["4+1 Ev","Standart temizlik"]
  ],

  "Teknik Servis":[
    ["Elektrik","Elektrik işleri"],
    ["Tesisat","Su ve tesisat"],
    ["Montaj","Montaj desteği"],
    ["Diğer","Diğer teknik işler"]
  ],

  "Araç Yıkama":[
    ["Otomobil","Dış yıkama"],
    ["SUV","Dış yıkama"],
    ["Ticari","Dış yıkama"],
    ["İç + Dış","Detaylı temizlik"]
  ],

  "Koltuk Yıkama":[
    ["Koltuk","Koltuk temizliği"],
    ["Kanepe","Kanepe temizliği"],
    ["Sandalye","Sandalye temizliği"],
    ["Yatak","Yatak temizliği"]
  ]

};


/* GÜVENLİ HTML */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m =>
        ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m])
    );

}


/* TELEFON */

function phone(value){

  return String(
    value || ""
  ).replace(
    /\D/g,
    ""
  );

}


/* TOAST */

function toast(message){

  const e =
    document.getElementById(
      "toast"
    );

  e.textContent =
    message;

  e.classList.add(
    "show"
  );

  clearTimeout(
    toast.t
  );

  toast.t =
    setTimeout(
      ()=>{
        e.classList.remove(
          "show"
        );
      },
      3500
    );

}


/* STORAGE */

function storageKey(){

  return (
    "baksana_orders_" +
    SITE_SLUG
  );

}


function tracked(){

  try{

    return JSON.parse(
      localStorage.getItem(
        storageKey()
      ) ||
      "[]"
    );

  }catch{

    return [];

  }

}


function remember(
  code,
  p
){

  let list =
    tracked()
    .filter(
      x =>
        x.order_code !==
        code
    );

  list.unshift({

    order_code:
      code,

    phone:
      phone(p)

  });

  localStorage.setItem(
    storageKey(),
    JSON.stringify(
      list.slice(
        0,
        50
      )
    )
  );

}


/* NAV */

function setNav(index){

  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      (b,i)=>
        b.classList.toggle(
          "active",
          i === index
        )
    );

}


/* TARİH */

function formatDate(value){

  if(!value)
    return "-";

  return new Date(
    value + "T00:00:00"
  )
  .toLocaleDateString(
    "tr-TR",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}


/* SITE'YI SUPABASE'DEN ÇEK */

async function loadSite(){

  const {
    data,
    error
  } =
  await db.rpc(
    "get_public_site",
    {
      p_slug:
        SITE_SLUG
    }
  );


  if(error)
    throw error;


  if(!data)
    throw new Error(
      "Site bulunamadı."
    );


  site =
    data;


  document
    .getElementById(
      "siteName"
    )
    .textContent =
    site.name;

}


/* UYGULAMAYI BAŞLAT */

async function init(){

  try{

    await loadSite();


    document
      .getElementById(
        "onboarding"
      )
      .style
      .display =
      "none";


    document
      .getElementById(
        "app"
      )
      .style
      .display =
      "block";


    showHome();


    startRefresh();

  }

  catch(error){

    console.error(
      error
    );

    toast(
      "Site bilgileri yüklenemedi: " +
      error.message
    );

  }

}


/* ONBOARDING */

function startApp(){

  localStorage.setItem(
    "baksana_onboarding_seen",
    "true"
  );

  init();

}


function resetIntro(){

  localStorage.removeItem(
    "baksana_onboarding_seen"
  );

  location.reload();

}


/* LOAD */

window.addEventListener(
  "load",
  ()=>{

    const date =
      document.getElementById(
        "serviceDate"
      );

    if(date){

      date.min =
        new Date()
          .toISOString()
          .split("T")[0];

    }


    if(
      localStorage.getItem(
        "baksana_onboarding_seen"
      ) ===
      "true"
    ){

      init();

    }

  }
);


/* ANA SAYFA */

function showHome(){

  page =
    "home";

  setNav(
    0
  );


  document
    .getElementById(
      "main"
    )
    .innerHTML = `

      <div class="hello">

        <h1>
          Merhaba 👋
        </h1>

        <p>
          ${esc(
            site.name
          )}
          bugün sizin için
          ne yapabilir?
        </p>

      </div>


      <div class="search">

        🔍

        <span>
          Hizmet ara...
        </span>

      </div>


      <div class="sec-head">

        <h2>
          Hizmetler
        </h2>

        <button
          class="link"
          onclick="toast('Tüm hizmetler yakında burada.')"
        >
          Tümü →
        </button>

      </div>


      <div class="grid">


        <div
          class="card"
          onclick="openService('Ev Temizliği')"
        >

          <div class="icon clean">
            🧹
          </div>

          <h3>
            Ev Temizliği

      empty(

/* SUNUCUDAN SİPARİŞ */

async function getOrder(
  item
){

  const {
    data,
    error
  } =
  await db.rpc(
    "get_public_order",
    {

      p_order_code:
        String(
          item.order_code ||
          ""
        )
        .trim()
        .toUpperCase(),

      p_phone:
        phone(
          item.phone
        )

    }
  );


  if(error){

    console.error(
      error
    );

    return null;

  }


  return data || null;

}


/* AKTİF SİPARİŞLERİ YENİLE */

async function refreshTracked(){

  const list =
    tracked();


  if(!list.length)
    return [];


  const results =
    await Promise.all(
      list.map(
        getOrder
      )
    );


  return results
    .filter(Boolean)
    .sort(
      (a,b)=>
        new Date(
          b.created_at
        ) -
        new Date(
          a.created_at
        )
    );

}


/* MANUEL TAKİP */

async function lookupOrder(){

  const code =
    document
      .getElementById(
        "trackCode"
      )
      .value
      .trim()
      .toUpperCase();


  const p =
    document
      .getElementById(
        "trackPhone"
      )
      .value
      .trim();


  if(
    !code ||
    !p
  ){

    toast(
      "Sipariş kodu ve telefonu gir."
    );

    return;

  }


  const order =
    await getOrder({
      order_code:
        code,
      phone:
        p
    });


  if(!order){

    toast(
      "Sipariş bulunamadı. Kod ve telefonu kontrol et."
    );

    return;

  }


  remember(
    order.order_code,
    p
  );


  toast(
    "Sipariş başarıyla eklendi."
  );


  showOrders();

}


/* SİPARİŞ KARTI */

function orderCard(
  order
){

  let cls =
    "waiting";


  if(
    order.status ===
    "Kabul Edildi"
  ){

    cls =
      "accepted";

  }


  if(
    order.status ===
    "Devam Ediyor"
  ){

    cls =
      "progress";

  }


  if(
    order.status ===
    "Tamamlandı"
  ){

    cls =
      "done";

  }


  if(
    order.status ===
    "Reddedildi"
  ){

    cls =
      "rejected";

  }


  return `

    <div class="ord">


      <div class="ordtop">

        <div>

          <div class="code">

            ${esc(
              order.order_code
            )}

          </div>

          <h3>

            ${esc(
              order.service
            )}

          </h3>

        </div>


        <span
          class="status ${cls}"
        >

          ${esc(
            order.status
          )}

        </span>

      </div>


      <div class="oinfo">

        <div>
          📅
          ${esc(
            formatDate(
              order.service_date
            )
          )}
        </div>

        <div>
          🕐
          ${esc(
            order.service_time
          )}
        </div>

      </div>


      <div class="loc">

        🏢
        ${esc(
          order.site_name ||
          site.name
        )}

        <br>

        📍
        ${esc(
          order.block
        )}
        •
        ${esc(
          order.apartment
        )}

      </div>


      ${
        order.option
        ?
        `
        <div class="opt">
          ${esc(
            order.option
          )}
        </div>
        `
        :
        ""
      }


      <div class="biz">

        İşletme:

        <b>

          ${esc(
            order.business_name ||
            "BAKSANA"
          )}

        </b>

      </div>


      ${
        order.rejection_reason
        ?
        `
        <div class="opt">

          Red nedeni:

          ${esc(
            order.rejection_reason
          )}

        </div>
        `
        :
        ""
      }


    </div>

  `;

}

/* HİZMET MODALI */

function openService(
  serviceName
){

  service =
    serviceName;

  option =
    "";


  document
    .getElementById(
      "serviceTitle"
    )
    .textContent =
    serviceName;


  const box =
    document.getElementById(
      "options"
    );


  box.innerHTML =
    "";


  serviceOptions[
    serviceName
  ]
  .forEach(
    item=>{

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "optpick";


      div.innerHTML = `

        <strong>
          ${esc(
            item[0]
          )}
        </strong>

        <small>
          ${esc(
            item[1]
          )}
        </small>

      `;


      div.onclick =
        ()=>{

          document
            .querySelectorAll(
              ".optpick"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "selected"
                )
            );


          div.classList.add(
            "selected"
          );


          option =
            item[0];

        };


      box.appendChild(
        div
      );

    }
  );


  document
    .getElementById(
      "serviceModal"
    )
    .classList.add(
      "show"
    );

}


/* MODAL KAPAT */

function closeService(){

  document
    .getElementById(
      "serviceModal"
    )
    .classList.remove(
      "show"
    );

}


document
  .getElementById(
    "serviceModal"
  )
  .addEventListener(
    "click",
    e=>{

      if(
        e.target.id ===
        "serviceModal"
      ){

        closeService();

      }

    }
  );


/* SİPARİŞ OLUŞTUR */

async function createOrder(){

  const date =
    document
      .getElementById(
        "serviceDate"
      )
      .value;


  const time =
    document
      .getElementById(
        "serviceTime"
      )
      .value;


  const block =
    document
      .getElementById(
        "block"
      )
      .value
      .trim();


  const apartment =
    document
      .getElementById(
        "apartment"
      )
      .value
      .trim();


  const p =
    document
      .getElementById(
        "phone"
      )
      .value
      .trim();


  const note =
    document
      .getElementById(
        "note"
      )
      .value
      .trim();


  const button =
    document.getElementById(
      "createBtn"
    );


  if(!option){

    toast(
      "Lütfen hizmet seçeneğini seçin."
    );

    return;

  }


  if(
    !date ||
    !time ||
    !block ||
    !apartment ||
    !p
  ){

    toast(
      "Lütfen gerekli alanları doldurun."
    );

    return;

  }


  if(
    phone(p).length <
    10
  ){

    toast(
      "Geçerli bir telefon numarası girin."
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Sipariş oluşturuluyor...";


  try{

    const {
      data,
      error
    } =
    await db.rpc(
      "create_public_order",
      {

        p_site_slug:
          site.slug,

        p_service:
          service,

        p_option:
          option,

        p_customer_name:
          "Site Sakini",

        p_phone:
          phone(p),

        p_block:
          block,

        p_apartment:
          apartment,

        p_service_date:
          date,

        p_service_time:
          time,

        p_note:
          note ||
          null

      }
    );


    if(error){

      throw error;

    }


    if(
      !data ||
      !data.order_code
    ){

      throw new Error(
        "Sipariş kodu alınamadı."
      );

    }


    remember(
      data.order_code,
      p
    );


    closeService();


    toast(
      "Talebiniz oluşturuldu • " +
      data.order_code
    );


    document
      .getElementById(
        "serviceDate"
      )
      .value =
      "";

    document
      .getElementById(
        "serviceTime"
      )
      .value =
      "";

    document
      .getElementById(
        "block"
      )
      .value =
      "";

    document
      .getElementById(
        "apartment"
      )
      .value =
      "";

    document
      .getElementById(
        "phone"
      )
      .value =
      "";

    document
      .getElementById(
        "note"
      )
      .value =
      "";

    option =
      "";


    setTimeout(
      showOrders,
      400
    );


  }catch(error){

    console.error(
      "CREATE ORDER ERROR:",
      error
    );

    toast(
      "Sipariş oluşturulamadı: " +
      (
        error.message ||
        "Bilinmeyen hata"
      )
    );

  }finally{

    button.disabled =
      false;

    button.textContent =
      "Talep Oluştur →";

  }

}


/* OTOMATİK TAKİP */

function startRefresh(){

  clearInterval(
    refreshTimer
  );


  refreshTimer =
    setInterval(
      async ()=>{

        if(
          page !==
          "orders"
        )
          return;


        const list =
          await refreshTracked();


        const box =
          document.getElementById(
            "ordersList"
          );


        if(
          box &&
          list.length
        ){

          box.innerHTML =
            list
              .map(
                orderCard
              )
              .join("");

        }

      },
      15000
    );

}
