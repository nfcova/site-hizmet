<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>BAKSANA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   GENEL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --purple:#6735e8;
    --purple2:#8055f5;
    --dark:#11121a;
    --gray:#656675;
    --light:#f8f8fb;
    --border:#e9e9ef;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:#f2f2f5;
    color:var(--dark);
}

body{
    overflow-x:hidden;
}


/* =====================================================
   ONBOARDING
===================================================== */

#onboarding{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#fff;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.onboarding-inner{
    width:100%;
    max-width:500px;
    margin:auto;
    min-height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
    padding:48px 24px 24px;
}


/* =====================================================
   LOGO
===================================================== */

.logo-area{
    text-align:center;
    position:relative;
    z-index:3;
}

.logo-symbol{
    width:108px;
    height:108px;
    margin:0 auto 10px;
    display:block;
    object-fit:contain;
}

.brand-name{
    font-size:42px;
    line-height:1;
    font-weight:850;
    letter-spacing:-2.5px;
    color:#11121a;
}

.tagline{
    margin-top:12px;
    font-size:12px;
    letter-spacing:4px;
    font-weight:500;
    color:#555765;
}


/* =====================================================
   INTRO
===================================================== */

.intro-text{
    text-align:center;
    font-size:20px;
    line-height:1.45;
    font-weight:400;
    color:#20212a;
    max-width:350px;
    margin:34px auto 0;
    position:relative;
    z-index:3;
}


/* =====================================================
   KARAKALEM
===================================================== */

.sketch-area{
    position:absolute;
    left:0;
    right:0;
    bottom:105px;
    height:360px;
    overflow:hidden;
    opacity:.78;
    pointer-events:none;
}

.sketch{
    position:absolute;
    width:100%;
    height:100%;
    bottom:0;
}

.building{
    fill:#fafafa;
    stroke:#777;
    stroke-width:1.4;
}

.building-dark{
    fill:#f3f3f3;
    stroke:#555;
    stroke-width:1.5;
}

.window{
    fill:none;
    stroke:#888;
    stroke-width:1;
}

.tree{
    fill:none;
    stroke:#777;
    stroke-width:1.3;
    stroke-linecap:round;
}

.path{
    fill:none;
    stroke:#888;
    stroke-width:1.5;
}

.gate{
    fill:none;
    stroke:#666;
    stroke-width:1.5;
}


/* =====================================================
   İLERİ
===================================================== */

.next-btn{
    position:absolute;
    left:24px;
    right:24px;
    bottom:112px;
    height:62px;
    border:0;
    border-radius:32px;
    background:
        linear-gradient(
            135deg,
            var(--purple2),
            var(--purple)
        );
    color:#fff;
    font-size:19px;
    font-weight:700;
    box-shadow:
        0 12px 28px rgba(103,53,232,.24);
    z-index:5;
}

.next-btn span{
    font-size:27px;
    margin-left:10px;
    vertical-align:-2px;
}


/* =====================================================
   ÖZELLİKLER
===================================================== */

.features{
    position:absolute;
    left:20px;
    right:20px;
    bottom:22px;
    height:70px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    z-index:5;
}

.feature{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    position:relative;
}

.feature:not(:last-child)::after{
    content:"";
    position:absolute;
    right:0;
    top:8px;
    width:1px;
    height:48px;
    background:#dddde4;
}

.feature-icon{
    width:29px;
    height:29px;
    margin-bottom:7px;
    color:var(--purple);
}

.feature-title{
    font-size:13px;
    line-height:1.2;
    color:#30313b;
    font-weight:500;
}


/* =====================================================
   ANA UYGULAMA
===================================================== */

#app{
    display:none;
    min-height:100vh;
    background:#f7f7fa;
    padding-bottom:80px;
}


/* =====================================================
   HEADER
===================================================== */

.app-header{
    background:#fff;
    padding:22px 20px 16px;
    border-bottom:1px solid #eeeef2;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header-brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.mini-logo{
    width:42px;
    height:42px;
    object-fit:contain;
    display:block;
}

.header-text small{
    display:block;
    font-size:11px;
    color:#7a7b87;
    margin-bottom:2px;
}

.header-text strong{
    font-size:17px;
    font-weight:750;
}

.notification{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#f5f3ff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--purple);
}


/* =====================================================
   İÇERİK
===================================================== */

.home-content{
    padding:22px 18px;
}


/* =====================================================
   ANA SAYFA
===================================================== */

.hello{
    margin-bottom:18px;
}

.hello h1{
    font-size:28px;
    letter-spacing:-.8px;
    margin-bottom:5px;
}

.hello p{
    color:#747582;
    font-size:15px;
}


/* =====================================================
   ARAMA
===================================================== */

.search{
    height:50px;
    background:#fff;
    border:1px solid #ededf1;
    border-radius:16px;
    display:flex;
    align-items:center;
    padding:0 16px;
    color:#92939d;
    margin-bottom:20px;
}

.search span{
    margin-left:9px;
    font-size:14px;
}


/* =====================================================
   HİZMETLER
===================================================== */

.services-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.services-title h2{
    font-size:20px;
}

.services-title button{
    border:0;
    background:none;
    color:var(--purple);
    font-weight:650;
}

.services-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.service-card{
    background:#fff;
    border:1px solid #ededf1;
    border-radius:20px;
    padding:17px;
    min-height:160px;
    cursor:pointer;
    transition:.2s;
}

.service-card:active{
    transform:scale(.98);
}

.service-icon{
    width:48px;
    height:48px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    margin-bottom:12px;
}

.cleaning{
    background:#eee9ff;
}

.technical{
    background:#fff2d8;
}

.car{
    background:#e5f1ff;
}

.sofa{
    background:#e5f7ef;
}

.service-card h3{
    font-size:16px;
    margin-bottom:5px;
}

.service-card p{
    font-size:12px;
    line-height:1.4;
    color:#777986;
}


/* =====================================================
   PROMO
===================================================== */

.promo{
    margin-top:16px;
    min-height:135px;
    border-radius:22px;
    padding:22px;
    color:#fff;
    background:
        linear-gradient(
            110deg,
            #4720ba,
            #7441ed
        );
    position:relative;
    overflow:hidden;
}

.promo::after{
    content:"";
    position:absolute;
    width:190px;
    height:190px;
    border-radius:50%;
    right:-70px;
    top:-70px;
    background:rgba(255,255,255,.08);
}

.promo h3{
    font-size:20px;
    max-width:210px;
    margin-bottom:6px;
}

.promo p{
    font-size:13px;
    opacity:.86;
    max-width:230px;
}


/* =====================================================
   SAYFA BAŞLIĞI
===================================================== */

.page-header{
    padding:8px 2px 20px;
}

.page-header h1{
    font-size:28px;
    letter-spacing:-.8px;
    margin-bottom:6px;
}

.page-header p{
    color:#777986;
    font-size:14px;
    line-height:1.5;
}


/* =====================================================
   SİPARİŞLER
===================================================== */

.orders-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.order-card{
    background:#fff;
    border:1px solid #ededf1;
    border-radius:20px;
    padding:17px;
}

.order-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.order-code{
    color:var(--purple);
    font-size:11px;
    font-weight:750;
    margin-bottom:5px;
}

.order-card h3{
    font-size:17px;
}

.order-status{
    padding:7px 10px;
    border-radius:20px;
    font-size:10px;
    font-weight:700;
    white-space:nowrap;
}

.status-waiting{
    background:#fff3d7;
    color:#a66b00;
}

.status-accepted{
    background:#e8f1ff;
    color:#2867c7;
}

.status-progress{
    background:#eee9ff;
    color:#6735e8;
}

.status-completed{
    background:#e4f7ed;
    color:#208653;
}

.status-rejected{
    background:#ffe8e8;
    color:#c73737;
}

.order-info{
    display:flex;
    gap:18px;
    color:#60616d;
    font-size:13px;
    margin-bottom:10px;
}

.order-location{
    color:#777986;
    font-size:13px;
    padding-top:10px;
    border-top:1px solid #f0f0f3;
}

.order-option{
    display:inline-block;
    margin-top:10px;
    background:#f5f2ff;
    color:var(--purple);
    padding:7px 10px;
    border-radius:9px;
    font-size:12px;
    font-weight:650;
}

.empty-orders{
    background:#fff;
    border:1px solid #ededf1;
    border-radius:22px;
    padding:34px 22px;
    text-align:center;
}

.empty-icon{
    width:70px;
    height:70px;
    border-radius:22px;
    background:#eee9ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    margin:0 auto 18px;
}

.empty-orders h2{
    font-size:19px;
    margin-bottom:8px;
}

.empty-orders p{
    color:#777986;
    font-size:14px;
    line-height:1.5;
    margin-bottom:22px;
}


/* =====================================================
   HESABIM
===================================================== */

.profile-card{
    background:#fff;
    border:1px solid #ededf1;
    border-radius:22px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:14px;
}

.profile-avatar{
    width:58px;
    height:58px;
    border-radius:19px;
    background:#eee9ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
}

.profile-card h2{
    font-size:18px;
    margin-bottom:4px;
}

.profile-card p{
    color:#777986;
    font-size:13px;
}

.account-section{
    background:#fff;
    border:1px solid #ededf1;
    border-radius:22px;
    overflow:hidden;
}

.account-item{
    min-height:72px;
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:13px;
    border-bottom:1px solid #f0f0f3;
}

.account-item:last-child{
    border-bottom:0;
}

.account-item-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    background:#f3f0ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
}

.account-item > div:nth-child(2){
    flex:1;
}

.account-item strong{
    display:block;
    font-size:14px;
    margin-bottom:3px;
}

.account-item span{
    display:block;
    color:#80818c;
    font-size:12px;
}

.account-item button{
    border:0;
    background:none;
    color:var(--purple);
    font-size:23px;
}

.account-help{
    margin-top:14px;
    padding:18px;
    background:#f0ecff;
    border-radius:20px;
}

.account-help strong{
    display:block;
    font-size:15px;
    margin-bottom:6px;
}

.account-help p{
    color:#656675;
    font-size:13px;
    line-height:1.5;
}


/* =====================================================
   ALT MENÜ
===================================================== */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:70px;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(16px);
    border-top:1px solid #e9e9ef;
    display:flex;
    z-index:100;
}

.nav-item{
    flex:1;
    border:0;
    background:none;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:4px;
    color:#858691;
    font-size:11px;
}

.nav-item.active{
    color:var(--purple);
    font-weight:650;
}

.nav-icon{
    font-size:22px;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,15,22,.48);
    z-index:500;
    display:none;
    align-items:flex-end;
}

.modal.show{
    display:flex;
}

.sheet{
    width:100%;
    max-height:92vh;
    overflow-y:auto;
    background:#fff;
    border-radius:28px 28px 0 0;
    padding:22px 20px 30px;
    animation:up .25s ease;
}

@keyframes up{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.sheet-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.sheet-head h2{
    font-size:22px;
}

.close{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#f3f3f7;
    font-size:20px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:650;
    margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid #dedee6;
    border-radius:13px;
    height:48px;
    padding:0 13px;
    font-size:15px;
    outline:none;
    background:#fff;
}

.form-group textarea{
    height:90px;
    padding:13px;
    resize:none;
}

.option-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.option{
    border:1.5px solid #e2e2e9;
    border-radius:14px;
    padding:14px;
    cursor:pointer;
}

.option.selected{
    border-color:var(--purple);
    background:#f5f2ff;
}

.option strong{
    display:block;
    margin-bottom:4px;
}

.option small{
    color:#777;
}

.primary{
    width:100%;
    height:55px;
    border:0;
    border-radius:28px;
    background:
        linear-gradient(
            135deg,
            var(--purple2),
            var(--purple)
        );
    color:#fff;
    font-size:16px;
    font-weight:700;
    margin-top:8px;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;
    left:18px;
    right:18px;
    bottom:88px;
    background:#171820;
    color:#fff;
    padding:15px 18px;
    border-radius:14px;
    font-size:14px;
    z-index:1000;
    display:none;
}

.toast.show{
    display:block;
}


/* =====================================================
   KÜÇÜK TELEFON
===================================================== */

@media(max-height:720px){

    .onboarding-inner{
        padding-top:28px;
    }

    .logo-symbol{
        width:80px;
        height:80px;
    }

    .brand-name{
        font-size:34px;
    }

    .tagline{
        font-size:9px;
        letter-spacing:3px;
    }

    .intro-text{
        margin-top:20px;
        font-size:17px;
    }

    .sketch-area{
        height:290px;
        bottom:92px;
    }

    .next-btn{
        bottom:98px;
        height:56px;
    }

    .features{
        bottom:14px;
    }
}

@media(max-width:360px){

    .brand-name{
        font-size:31px;
    }

    .tagline{
        font-size:8px;
    }

    .intro-text{
        font-size:16px;
    }

    .service-card{
        padding:14px;
    }

    .service-card h3{
        font-size:15px;
    }
}

</style>
</head>

function showOrders(){

    currentPage = "orders";

    setActiveNav(1);


    const orders =
        JSON.parse(
            localStorage.getItem(
                "baksana_orders"
            ) || "[]"
        );


    if(!orders.length){

        document.getElementById(
            "mainContent"
        ).innerHTML = `

            <div class="page-header">

                <h1>
                    Siparişlerim
                </h1>

                <p>
                    Hizmet taleplerinizi
                    buradan takip edebilirsiniz.
                </p>

            </div>


            <div class="empty-orders">

                <div class="empty-icon">
                    📦
                </div>

                <h2>
                    Henüz siparişiniz yok
                </h2>

                <p>
                    İhtiyacınız olan hizmeti seçerek
                    ilk siparişinizi oluşturabilirsiniz.
                </p>

                <button
                    class="page-button"
                    onclick="showHome()"
                >
                    Hizmetlere Git →
                </button>

            </div>

        `;

        return;

    }


    let html = "";


    orders.forEach(
    order=>{

        const status =
            order.status ||
            "Beklemede";


        let statusClass =
            "status-waiting";


        if(status === "Kabul Edildi"){
            statusClass = "status-accepted";
        }

        if(status === "Devam Ediyor"){
            statusClass = "status-progress";
        }

        if(status === "Tamamlandı"){
            statusClass = "status-completed";
        }

        if(status === "Reddedildi"){
            statusClass = "status-rejected";
        }


        const code =
            order.order_code ||
            (
                order.details &&
                order.details.order_code
            ) ||
            "BK------";


        const option =
            (
                order.details &&
                order.details.option
            ) ||
            "";


        html += `

            <div class="order-card">

                <div class="order-top">

                    <div>

                        <div class="order-code">
                            ${code}
                        </div>

                        <h3>
                            ${order.service}
                        </h3>

                    </div>

                    <span
                        class="order-status ${statusClass}"
                    >
                        ${status}
                    </span>

                </div>


                <div class="order-info">

                    <div>
                        📅
                        ${formatDate(
                            order.service_date
                        )}
                    </div>

                    <div>
                        🕐
                        ${order.service_time}
                    </div>

                </div>


                <div class="order-location">

                    📍
                    ${order.block}
                    •
                    ${order.apartment}

                </div>


                ${
                    option
                    ?
                    `
                    <div class="order-option">
                        ${option}
                    </div>
                    `
                    :
                    ""
                }

            </div>

        `;

    });


    document.getElementById(
        "mainContent"
    ).innerHTML = `

        <div class="page-header">

            <h1>
                Siparişlerim

            <p>
                Siparişlerinizi buradan takip edin.
            </p>

        </div>


        <div class="orders-list">

            ${html}

        </div>

    `;

}

function openService(service){

    currentService = service;

    selectedOption = "";


    document.getElementById(
        "serviceTitle"
    ).innerText = service;


    const options =
        document.getElementById(
            "options"
        );


    options.innerHTML = "";


    serviceOptions[service].forEach(
    item=>{

        const div =
            document.createElement(
                "div"
            );


        div.className = "option";


        div.innerHTML = `

            <strong>
                ${item[0]}
            </strong>

            <small>
                ${item[1]}
            </small>

        `;


        div.onclick = ()=>{

            document
                .querySelectorAll(
                    ".option"
                )
                .forEach(
                    x=>
                    x.classList.remove(
                        "selected"
                    )
                );


            div.classList.add(
                "selected"
            );


            selectedOption =
                item[0];

        };


        options.appendChild(div);

    });


    document
        .getElementById(
            "serviceModal"
        )
        .classList.add(
            "show"
        );

}

function setMinDate(){

        new Date()
        .toISOString()
        .split("T")[0];


    document.getElementById(
        "serviceDate"
    ).min = today;

}


/* =====================================================
   SİPARİŞ OLUŞTUR
===================================================== */

async function createOrder(){

    const date =
        document.getElementById(
            "serviceDate"
        ).value;


    const time =
        document.getElementById(
            "serviceTime"
        ).value;


    const block =
        document.getElementById(
            "block"
        ).value.trim();


    const apartment =
        document.getElementById(
            "apartment"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const note =
        document.getElementById(
            "note"
        ).value.trim();


    if(!selectedOption){

        showToast(
            "Lütfen hizmet seçeneğini seçin."
        );

        return;

    }


    if(
        !date ||
        !time ||
        !block ||
        !apartment ||
        !phone
    ){

        showToast(
            "Lütfen gerekli alanları doldurun."
        );

        return;

    }


    const orderCode =
        "BK-" +
        Math.random()
        .toString(36)
        .substring(2,7)
        .toUpperCase();


    const order = {

        service:currentService,

        customer_name:"Site Sakini",

        phone:phone,

        block:block,

        apartment:apartment,

        service_date:date,

        service_time:time,

        note:note,

        status:"Beklemede",

        details:{

            site_id:SITE_ID,

            site_name:SITE_NAME,

            option:selectedOption,

            order_code:orderCode

        }

    };


    const {
        error
    } =
        await supabaseClient
        .from("orders")
        .insert([order]);


    if(error){

        console.error(error);

        showToast(
            "Sipariş oluşturulurken bir hata oluştu."
        );

        return;

    }


    const localOrders =
        JSON.parse(
            localStorage.getItem(
                "baksana_orders"
            ) || "[]"
        );


    localOrders.unshift({

        ...order,

        order_code:orderCode

    });


    localStorage.setItem(
        "baksana_orders",
        JSON.stringify(
            localOrders
        )
    );


    closeService();


    showToast(
        "Talebiniz oluşturuldu • " +
        orderCode
    );


    document.getElementById(
        "serviceDate"
    ).value = "";


    document.getElementById(
        "serviceTime"
    ).value = "";


    document.getElementById(
        "block"
    ).value = "";


    document.getElementById(
        "apartment"
    ).value = "";


    document.getElementById(
        "phone"
    ).value = "";


    document.getElementById(
        "note"
    ).value = "";


    selectedOption = "";


    /* SİPARİŞLERİM EKRANINI GÜNCELLE */

    showOrders();

}


/* =====================================================
   ALT MENÜ
===================================================== */

function setActiveNav(index){

    document
        .querySelectorAll(
            ".nav-item"
        )
        .forEach(
        (item,i)=>{

            item.classList.toggle(
                "active",
                i === index
            );

        });

}


/* =====================================================
   TARİH FORMAT
===================================================== */

function formatDate(date){

    if(!date){
        return "";
    }


    const d =
        new Date(
            date + "T00:00:00"
        );


    return d.toLocaleDateString(
        "tr-TR",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText = message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
        ()=>{

            toast.classList.remove(
                "show"
            );

        },
        3000
        );

}
